{% extends 'layout.html' %}

{% block content %}
    <div class="card">
        <div class="card-body">
            <h1 class="card-title">List of Users</h1>
            <hr>

            <div class="row row-cols-1 row-cols-md-2 g-4">
                {% for user in users %}
                    <div class="col">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">User ID: {{ user.user_id }}</h5>
                                <p class="card-text">Username: {{ user.username }}</p>
                                <p class="card-text">Name: {{ user.name }}</p>
                                <p class="card-text">Role: {{ user.type }}</p>
                                <form action="{{ url_for('delete_user', id=user.user_id) }}" method="post" style="display: inline;">
                                    <button 
                                        {% if user.type == 'Admin' %}
                                            disabled
                                        {% endif %}
                                        type="submit" class="btn btn-danger btn-sm">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
